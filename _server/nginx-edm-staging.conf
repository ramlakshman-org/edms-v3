# EDMS STAGING — new admin panel + user dashboard against a COPY of the app DB. See EDM/STAGING.md.
# Whole site behind a basic-auth wall; never indexed. Live (tnedms.com) is a separate server block.
server {
    server_name tnedms.online;

    root /var/www/edm-staging/frontend;
    index index.html;
    client_max_body_size 20M;

    auth_basic "EDMS staging";
    auth_basic_user_file /etc/nginx/.edm-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/auth/ {
        limit_req zone=auth_limit_staging burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5054;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5054;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # pre-built reports: live's folder, read only — and only for a logged-in app user (C10, 2026-10-14):
    # nginx asks the backend (/api/auth/check → 204 or 401) before serving the file.
    location = /_edm_auth_check {
        internal;
        proxy_pass http://127.0.0.1:5054/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location /report-files/ {
        auth_request /_edm_auth_check;
        alias /var/www/edm/reports/;
        autoindex off;
    }

    # SPA App Shell: Never cache index.html so users always receive fresh deployment bundles immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite hashed assets: safe to cache long term (hash changes on every build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tnedms.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tnedms.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = tnedms.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name tnedms.online;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}